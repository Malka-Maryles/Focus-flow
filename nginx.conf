# Client container (nginx) — the same image works in BOTH environments:
#   * Local docker-compose (Assignment 3): /api/* is proxied to the "backend" container.
#   * Cloud Run behind the Google Load Balancer (Assignment 4): the LB routes /api/*
#     and /health straight to the server service, so /api never reaches this container.
# The backend address is put in a variable and resolved per request (Docker's internal
# DNS at 127.0.0.11). That way nginx still starts on Cloud Run, where the hostname
# "backend" does not exist; a fixed proxy_pass would make nginx refuse to start there.
server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types
    include /etc/nginx/mime.types;
    types {
        application/wasm         wasm;
        application/octet-stream onnx;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Proxy /api requests to the backend (local docker-compose only)
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WASM files — serve directly, never fall back to index.html
    location ~* \.wasm$ {
        try_files $uri =404;
        add_header Content-Type application/wasm;
    }

    # ONNX model files — serve directly, never fall back to index.html
    location ~* \.onnx$ {
        try_files $uri =404;
        add_header Content-Type application/octet-stream;
        add_header Content-Disposition inline;
    }

    # All other requests — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
